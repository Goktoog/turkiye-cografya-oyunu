<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkiye Şehir Haritası Oyunu - KPSS Coğrafya</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark-theme">
    <header class="header">
        <div class="logo">
            <span class="logo-icon">🗺️</span>
            <h1>KPSS Türkiye Haritası</h1>
        </div>
        <div class="header-controls">
            <button id="theme-toggle" class="btn-theme" title="Temayı Değiştir">
                <span class="theme-icon sun">☀️</span>
                <span class="theme-icon moon">🌙</span>
            </button>
            <!-- Buradaki href kısmına kendi GitHub profil adresini yazabilirsin -->
            <a href="https://github.com/kullanici-adin" id="github-link" target="_blank" class="btn-github">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
                </svg>
                GitHub Profile
            </a>
        </div>
    </header>

    <main class="main-container">
        <!-- Top Stats Bar & Target City Card -->
        <section class="game-dashboard">
            <div class="card question-card">
                <span class="card-label">BULMAN GEREKEN ŞEHİR</span>
                <h2 id="target-city-name">Hazırlanıyor...</h2>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-icon">🎯</span>
                    <div>
                        <span class="stat-value" id="score-counter">0 / 81</span>
                        <span class="stat-title">Doğru Şehir</span>
                    </div>
                </div>
                <div class="stat-box">
                    <span class="stat-icon">❌</span>
                    <div>
                        <span class="stat-value" id="mistake-counter">0</span>
                        <span class="stat-title">Hatalı Tıklama</span>
                    </div>
                </div>
                <div class="stat-box">
                    <span class="stat-icon">⏱️</span>
                    <div>
                        <span class="stat-value" id="timer">00:00</span>
                        <span class="stat-title">Geçen Süre</span>
                    </div>
                </div>
            </div>

            <div class="action-bar">
                <button id="restart-btn" class="btn-restart">
                    🔄 Oyunu Sıfırla
                </button>
            </div>
        </section>

        <!-- Enlarged Map Container -->
        <section class="map-wrapper">
            <div id="map-container" class="map-container">
                <!-- SVG Haritan Burada Yer Alıyor -->
            </div>
        </section>
    </main>

    <!-- Game Over Modal / Result Summary -->
    <div id="game-over-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-trophy">🏆</span>
                <h2>TEBRİKLER, HARİTAYI TAMAMLADIN!</h2>
                <p id="player-title" class="player-title">Coğrafya Üstadı</p>
            </div>

            <div class="modal-body">
                <div class="summary-grid">
                    <div class="summary-item">
                        <span class="summary-label">Toplam Süre</span>
                        <span class="summary-val" id="final-time">00:00</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Toplam Hata</span>
                        <span class="summary-val" id="final-mistakes">0</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">İsabet Oranı</span>
                        <span class="summary-val" id="final-accuracy">%100</span>
                    </div>
                </div>

                <div class="mistakes-breakdown">
                    <h3>En Çok Zorlandığın Şehirler</h3>
                    <ul id="top-mistakes-list" class="mistakes-list">
                        <!-- JS ile dolacak -->
                    </ul>
                </div>
            </div>

            <div class="modal-footer">
                <button id="modal-restart-btn" class="btn-primary-large">
                    🔄 Yeniden Başla
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
